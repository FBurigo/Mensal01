# Cabeçalhos de segurança da aplicação.
#
# No Nginx, um `add_header` dentro de um `location` cancela os cabeçalhos
# herdados do nível `server`. Por isso este trecho é incluído em cada bloco:
# sem ele, CSS e JS (que definem Cache-Control) sairiam sem `nosniff` e sem CSP.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
