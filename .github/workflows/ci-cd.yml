name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: fburigo

jobs:
  test:
    name: Testes (qualidade)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        working-directory: backend
        run: pytest -v

  # Constrói a imagem do backend e confere a associação com o commit antes de
  # qualquer publicação: /api/version, rótulo OCI e variável APP_VERSION
  # precisam apontar para o mesmo SHA.
  backend-smoke:
    name: Versão e associação com o commit (backend)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: mensal01-backend:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verificar a imagem do backend
        run: bash ./scripts/smoke-backend.sh mensal01-backend:ci "${{ github.sha }}"

  # Constrói a imagem do frontend e a exercita antes de qualquer publicação:
  # o Nginx precisa subir sozinho, servir os estáticos, aplicar os cabeçalhos
  # de segurança, encaminhar /api e não conter segredos.
  frontend-smoke:
    name: Nginx, proxy /api e segredos (frontend)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: mensal01-frontend:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verificar a imagem do frontend
        run: bash ./scripts/smoke-frontend.sh mensal01-frontend:ci "${{ github.sha }}"

  build-and-push:
    name: Build e publicação (${{ matrix.service }})
    needs: [test, backend-smoke, frontend-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: mensal01-backend
            build_args: |
              APP_VERSION=${{ github.sha }}
          - service: frontend
            context: ./frontend
            image: mensal01-frontend
            build_args: |
              APP_VERSION=${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publica somente em push direto para main (nunca em Pull Request).
      # Em PRs o build acontece normalmente, validando o Dockerfile, mas a
      # imagem não é enviada ao GHCR.
      - name: Build e push da imagem (${{ matrix.image }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Resumo da publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Imagem publicada: ${{ matrix.service }}"
            echo "- Tag: \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pacote: https://github.com/${{ env.IMAGE_OWNER }}/Mensal01/pkgs/container/${{ matrix.image }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Evidência de que as imagens publicadas podem ser baixadas e iniciadas,
  # exatamente como a VM faria.
  verificar-publicacao:
    name: Download e inicialização das imagens publicadas
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar e iniciar as imagens publicadas
        run: bash ./scripts/verificar-imagem-publicada.sh "${{ github.sha }}"
