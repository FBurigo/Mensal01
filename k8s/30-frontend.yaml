# Frontend (Nginx): serve a interface e faz proxy de /api para o backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: estante
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: estante-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: estante-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
# NodePort: porta de entrada da aplicação.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: estante
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
